  </g>
  <path d="M39 92l41 29 42-29" stroke="#22C55E" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.4s" repeatCount="indefinite"/>
  </path>
</svg>
